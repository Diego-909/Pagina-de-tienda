<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | CelMarket</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="barra conteiner">
            <a href="index.html" class="logo" aria-label="CelMarket, ir al inicio">
                <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><rect x="9" y="2" width="14" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="25" r="1.8" fill="var(--color-acento)"/></svg>
                <span>CelMarket</span>
            </a>
            <button class="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Abrir menú">☰</button>
            <nav id="nav" class="navbar">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="tienda.html">Catálogo</a></li>
                    <li><a href="carrito.html" aria-current="page">Carrito (<span class="contador">0</span>)</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="conteiner">
            <h1>Tu carrito</h1>
            <div class="tabla-scroll">
                <table class="tabla">
                    <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody id="cuerpo-carrito"></tbody>
                </table>
            </div>
            <div class="carrito-pie">
                <form id="form-cupon" class="cupon">
                    <label>Cupón de descuento
                        <input type="text" id="cupon" placeholder="CEL10">
                    </label>
                    <button type="submit" class="btn">Aplicar cupón</button>
                    <p id="mensaje-cupon" role="status"></p>
                </form>
                <div>
                    <dl id="resumen" class="resumen"></dl>
                    <button id="vaciar" class="btn btn-sec" type="button">Vaciar carrito</button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer"><div class="conteiner">CelMarket · Celulares nuevos con garantía · Precios en soles, IGV incluido</div></footer>
    <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
    <script src="js/datos.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/carrito-pagina.js"></script>
</body>
</html>
