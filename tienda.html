<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | CelMarket</title>
    <!-- 1. Bootstrap 5.3.9 primero; 2. la marca después, para poder sobrescribirlo -->
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/marca.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable position-absolute bg-white p-2" href="#contenido">Saltar al contenido</a>

    <header>
        <nav class="navbar navbar-expand-md" data-bs-theme="dark" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">CelMarket</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto align-items-md-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="tienda.html" aria-current="page">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                    <button class="btn btn-warning ms-md-3 mt-2 mt-md-0" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#carrito-lateral" aria-controls="carrito-lateral">
                        Mi carrito <span class="badge text-bg-dark contador">0</span><span class="visually-hidden"> productos</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main id="contenido" class="flex-grow-1">

        <section class="container py-3">
            <h1>Catálogo</h1>

            <form id="filtros" class="row g-3 mb-3" role="search" aria-label="Buscar y filtrar celulares">
                <div class="col-12 col-md-5">
                    <label for="buscador" class="form-label fw-bold">Buscar por nombre</label>
                    <input type="search" id="buscador" class="form-control" placeholder="Ejemplo: Galaxy" autocomplete="off">
                </div>
                <div class="col-6 col-md-3">
                    <label for="categoria" class="form-label fw-bold">Categoría</label>
                    <select id="categoria" class="form-select"><option value="todas">Todas</option></select>
                </div>
                <div class="col-6 col-md-4">
                    <label for="orden" class="form-label fw-bold">Ordenar por</label>
                    <select id="orden" class="form-select">
                        <option value="nombre">Nombre (A–Z)</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                    </select>
                </div>
            </form>

            <h2 class="visually-hidden">Lista de celulares</h2>
            <div id="catalogo" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
        </section>

        <!-- Detalle del producto (modal de Bootstrap) -->
        <div class="modal fade" id="detalle" tabindex="-1" aria-labelledby="detalle-titulo" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title h4" id="detalle-titulo"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar detalle"></button>
                    </div>
                    <div class="modal-body" id="detalle-cuerpo"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="button" class="btn btn-primary" id="detalle-agregar" data-accion="agregar" data-id="">Agregar al carrito</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-primary text-white py-3 small">
        <div class="container">
            CelMarket · Celulares nuevos con garantía · Precios en soles, IGV incluido
        </div>
    </footer>

    <!-- Carrito lateral (offcanvas) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carrito-lateral" aria-labelledby="carrito-titulo">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5" id="carrito-titulo">Tu carrito</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar carrito"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="carrito-lineas"></div>
            <div id="carrito-pie" class="mt-auto pt-3" hidden>
                <p class="fs-5 fw-bold d-flex justify-content-between">Total estimado <span id="carrito-total"></span></p>
                <div class="d-grid gap-2">
                    <a href="checkout.html" class="btn btn-primary">Finalizar compra</a>
                    <a href="carrito.html" class="btn btn-outline-primary">Ver carrito completo</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Aviso (toast) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-aviso" class="toast text-bg-dark" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/tienda.js"></script>
</body>
</html>
